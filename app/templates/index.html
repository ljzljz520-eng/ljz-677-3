<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体检结果批量上传平台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <span class="logo">＋</span>
        <div>
          <h1>体检结果批量上传</h1>
          <p>导入 Excel · 本地校验 · 去重识别 · 限流上送健康平台 · 异常逐行可追溯</p>
        </div>
      </div>
      <div class="top-actions">
        <a class="btn btn-ghost" href="/api/template">⬇ 下载导入模板</a>
        <button class="btn btn-ghost" id="btnCatalog">查看项目目录</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <section class="card upload-card">
      <h2>第一步 · 选择体检结果 Excel</h2>
      <div class="upload-row">
        <label class="file-box" id="fileBox">
          <input type="file" id="fileInput" accept=".xlsx" hidden>
          <span class="file-icon">📄</span>
          <span class="file-text" id="fileText">点击选择 .xlsx 文件（含人员编号、项目、结果、单位、体检日期五列）</span>
        </label>
        <button class="btn btn-primary" id="btnUpload" disabled>开始校验并上送</button>
      </div>
      <div id="uploadMsg" class="upload-msg"></div>
    </section>

    <!-- 任务列表 -->
    <section class="card">
      <div class="card-head">
        <h2>第二步 · 任务进度</h2>
        <button class="btn btn-small" id="btnRefresh">刷新</button>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="taskTable">
          <thead>
            <tr>
              <th>任务编号</th><th>源文件</th><th>状态</th><th>进度</th>
              <th>总数</th><th>成功</th><th>校验失败</th><th>平台异常</th><th>重复</th>
              <th>创建时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="11" class="empty">暂无任务，请先上传 Excel</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 明细抽屉 -->
  <div class="drawer-mask" id="drawerMask" hidden>
    <aside class="drawer">
      <div class="drawer-head">
        <div>
          <h2 id="detailTitle">任务明细</h2>
          <p id="detailSub"></p>
        </div>
        <button class="btn btn-small" id="btnCloseDrawer">关闭</button>
      </div>
      <div class="tabs" id="rowTabs"></div>
      <div class="drawer-body table-wrap">
        <table class="data-table" id="rowTable">
          <thead>
            <tr>
              <th>Excel行号</th><th>人员编号</th><th>项目</th><th>结果</th><th>单位</th>
              <th>体检日期</th><th>状态</th><th>错误/平台返回</th><th>提示/记录号</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn btn-small" id="btnPrev">上一页</button>
        <span id="pageInfo"></span>
        <button class="btn btn-small" id="btnNext">下一页</button>
        <a class="btn btn-small btn-warn" id="btnExport" href="#">⬇ 导出异常 Excel</a>
      </div>
    </aside>
  </div>

  <!-- 项目目录弹窗 -->
  <div class="modal-mask" id="catalogMask" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>体检项目目录</h2>
        <button class="btn btn-small" id="btnCloseCatalog">关闭</button>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="catalogTable">
          <thead><tr><th>项目代码</th><th>项目名称</th><th>标准单位</th><th>参考范围</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
